[package]
name = "sanctum"
version = "0.1.0"
edition = "2021"
description = "Uroboros Sanctum: rate-limited, delayed, freezable vault for one Solana wallet"

[lib]
crate-type = ["cdylib", "lib"]
name = "sanctum"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.2", default-features = false, features = ["solana-v3", "token", "token_2022", "associated_token"] }
